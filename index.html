<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivendas de Barão — Cronograma da Obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #263934;
    --bg-panel: #34493F;
    --bg-panel-2: #3E5548;
    --line: rgba(243,238,231,0.14);
    --line-strong: rgba(243,238,231,0.28);
    --text: #F4EFE7;
    --text-dim: #B9C2BA;
    --accent: #C9987A;
    --accent-light: #E3C1A4;
    --st-half: #D9A441;
    --st-full: #6FA968;
    --st-ok: #6FA968;
    --st-ahead: #6E9FBD;
    --st-late: #D9A441;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:500; margin:0;}

  /* ---------- HEADER ---------- */
  header.site{
    position:sticky; top:0; z-index:50;
    background: rgba(38,57,52,0.92);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
    padding: 10px 22px;
    gap:10px 16px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand img{height:44px; width:auto; display:block; border-radius:4px;}
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-text .t1{font-family:'Fraunces',serif; font-size:17px; letter-spacing:.02em;}
  .brand-text .t2{font-size:11px; color:var(--text-dim); letter-spacing:.04em;}
  nav.site{display:flex; align-items:center; gap:10px; font-size:14px; flex-wrap:wrap;}
  nav.site .nav-link{padding:8px 14px; border:1px solid var(--line-strong); border-radius:20px; transition:.15s; color:var(--text); background:none; font-size:14px;}
  nav.site .nav-link:hover{border-color:var(--accent); color:var(--accent-light);}
  nav.site .nav-link.active{border-color:var(--accent); background:rgba(201,152,122,0.16); color:var(--accent-light);}

  main{max-width:1180px; margin:0 auto; padding:28px 22px 80px;}
  footer.site{text-align:center; padding:26px; color:var(--text-dim); font-size:11.5px; line-height:1.6;}

  /* ---------- COMUM ---------- */
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:22px;}
  .page-head h1{font-size:30px; margin-bottom:6px;}
  .page-head p{margin:0; color:var(--text-dim); font-size:14px; max-width:640px; line-height:1.5;}
  .card{background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px;}
  .card h2{font-size:18px; margin-bottom:8px;}
  .card p{margin:0 0 10px; font-size:13.5px; color:var(--text-dim); line-height:1.55;}
  .btn{padding:9px 16px; border:1px solid var(--line-strong); border-radius:20px; background:none; color:var(--text); font-size:13.5px; transition:.15s;}
  .btn:hover{border-color:var(--accent); color:var(--accent-light);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#2b1d12; font-weight:600;}
  .btn.primary:hover{background:var(--accent-light); color:#2b1d12;}
  .btn.danger{border-color:#c0655a; color:#f0b9b1;}
  .btn.danger:hover{background:rgba(192,101,90,.18);}
  select, input.txt, textarea{
    background:rgba(255,255,255,0.05); border:1px solid var(--line-strong); color:var(--text);
    border-radius:8px; padding:8px 10px; font:inherit; font-size:13.5px;
  }
  select option{color:#111;}
  textarea{width:100%; min-height:120px; font-family:ui-monospace,Consolas,monospace; font-size:12px; resize:vertical;}
  code.snip{display:block; background:#1c2925; border:1px solid var(--line-strong); border-radius:8px; padding:9px 12px; font-size:12px; overflow-x:auto; white-space:pre; margin:8px 0;}
  .banner{border:1px solid var(--line-strong); background:rgba(217,164,65,0.12); color:#f0dcb2; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:18px; line-height:1.5;}
  .banner a{text-decoration:underline;}
  .meta-line{font-size:12px; color:var(--text-dim); margin-top:6px;}
  .crumb{font-size:13px; color:var(--text-dim); margin-bottom:18px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .crumb a:hover{color:var(--accent-light);}

  /* status */
  .st-ok{background:var(--st-ok); color:#12321a;}
  .st-ahead{background:var(--st-ahead); color:#0e2635;}
  .st-late{background:var(--st-late); color:#3a2b0a;}
  .st-naoprev, .st-semdado{background:rgba(255,255,255,0.03); color:var(--text-dim); border:1.5px dashed var(--line-strong);}
  .legend-row{display:flex; gap:8px 18px; flex-wrap:wrap; margin:0 0 16px; font-size:12px; color:var(--text-dim); align-items:center;}
  .legend-row .item{display:flex; align-items:center; gap:6px;}
  .legend-row .sw{width:12px; height:12px; border-radius:3px; display:inline-block;}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{padding:5px 12px; border-radius:16px; font-size:12.5px; font-weight:600;}

  /* ---------- PAINEL ---------- */
  .tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg-panel);}
  table.painel{width:100%; border-collapse:separate; border-spacing:6px; min-width:540px; table-layout:fixed;}
  table.painel th.rowh{width:150px; text-align:left; font-weight:500; font-size:13px; padding:0 8px; position:sticky; left:0; background:var(--bg-panel); z-index:1; line-height:1.25;}
  table.painel thead th{font-family:'Fraunces',serif; font-weight:500; font-size:13px; color:var(--text-dim); text-align:center; padding:6px 0;}
  table.painel thead th.rowh{background:var(--bg-panel);}
  a.pcell{display:flex; flex-direction:column; align-items:center; justify-content:center; height:58px; border-radius:8px; border:1.5px solid transparent; transition:.12s;}
  a.pcell b{font-size:15px; font-variant-numeric:tabular-nums;}
  a.pcell i{font-style:normal; font-size:10px; opacity:.85; font-variant-numeric:tabular-nums;}
  a.pcell:hover{transform:translateY(-1px); border-color:var(--text);}
  .hint{font-size:12.5px; color:var(--text-dim); margin-top:12px;}

  /* ---------- DETALHE ---------- */
  .dhead{display:flex; flex-wrap:wrap; gap:18px 30px; align-items:center; justify-content:space-between;}
  .dhead h1{font-size:26px;}
  .dhead h1 small{font-size:15px; color:var(--text-dim); margin-left:8px; font-family:'Inter',sans-serif;}
  .pill{display:inline-block; padding:4px 12px; border-radius:14px; font-size:12px; font-weight:600; margin-top:8px;}
  .nums{display:flex; gap:28px;}
  .nums .big{font-family:'Fraunces',serif; font-size:34px; color:var(--accent-light); line-height:1;}
  .nums .big.dim{color:var(--text-dim);}
  .nums .lbl{font-size:11.5px; color:var(--text-dim); margin-top:4px;}
  .bar{position:relative; height:8px; border-radius:5px; background:rgba(255,255,255,0.09); margin-top:16px;}
  .bar .fill{height:100%; border-radius:5px; background:var(--accent);}
  .bar .mark{position:absolute; top:-4px; width:2px; height:16px; background:var(--text); border-radius:1px;}
  .bar.small{height:5px; margin-top:8px;}
  .callout{border:1px solid rgba(217,164,65,.5); background:rgba(217,164,65,.10); border-radius:var(--radius); padding:14px 18px; margin-bottom:18px;}
  .callout h2{font-size:16px; margin-bottom:6px; color:#f0dcb2;}
  .callout ul{margin:6px 0 0; padding-left:20px; font-size:13.5px; line-height:1.7;}
  .callout.good{border-color:rgba(111,169,104,.5); background:rgba(111,169,104,.10);}
  .callout.good h2{color:#cfe8cb;}
  .rule{font-size:12.5px; color:var(--text-dim); margin:0 0 12px;}
  .it{background:var(--bg-panel); border:1px solid var(--line); border-left:4px solid var(--line-strong); border-radius:8px; padding:11px 14px 13px; margin-bottom:8px;}
  .it.it-ok{border-left-color:var(--st-ok);}
  .it.it-atrasado{border-left-color:var(--st-late); background:rgba(217,164,65,0.08);}
  .it.it-adiantado{border-left-color:var(--st-ahead);}
  .it.it-andamento{border-left-color:var(--accent);}
  .it.it-futuro{opacity:.72;}
  .it-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .it .n{color:var(--text-dim); font-size:12px; width:22px; flex:none; font-variant-numeric:tabular-nums;}
  .it .nm{flex:1; font-size:14px; min-width:160px;}
  .it .tag{font-size:11px; padding:3px 9px; border-radius:11px; font-weight:600; background:rgba(255,255,255,0.07); color:var(--text-dim);}
  .it-ok .tag{background:var(--st-ok); color:#12321a;}
  .it-atrasado .tag{background:var(--st-late); color:#3a2b0a;}
  .it-adiantado .tag{background:var(--st-ahead); color:#0e2635;}
  .it .ipct{font-family:'Fraunces',serif; font-size:19px; width:56px; text-align:right; color:var(--accent-light); font-variant-numeric:tabular-nums;}
  .casas{display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); gap:5px; margin-top:10px; max-width:440px;}
  a.cs{display:flex; align-items:center; justify-content:center; aspect-ratio:1/1; border-radius:5px; font-size:11px; border:1px solid var(--line-strong); background:rgba(255,255,255,0.03); position:relative; color:var(--text-dim);}
  a.cs:hover{border-color:var(--accent);}
  a.cs.v50{background:var(--st-half); border-color:var(--st-half); color:#3a2b0a;}
  a.cs.v100{background:var(--st-full); border-color:var(--st-full); color:#12321a;}
  a.cs .star{position:absolute; top:0; right:2px; font-size:7px; font-style:normal; opacity:.8;}
  .pager{display:flex; justify-content:space-between; margin-top:18px; gap:10px; flex-wrap:wrap;}
  .manual-box{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .manual-box input{width:90px;}

  /* ---------- CRONOGRAMA ---------- */
  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .tabs a{padding:7px 15px; border:1px solid var(--line-strong); border-radius:18px; font-size:13.5px; transition:.15s;}
  .tabs a:hover{border-color:var(--accent); color:var(--accent-light);}
  .tabs a.active{background:var(--accent); border-color:var(--accent); color:#2b1d12; font-weight:600;}
  .crono-wrap{max-height:70vh; overflow:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg-panel);}
  table.crono{border-collapse:separate; border-spacing:0; font-size:12.5px;}
  table.crono th, table.crono td{padding:0; border-bottom:1px solid var(--line); border-right:1px solid rgba(243,238,231,0.06);}
  table.crono thead th{position:sticky; top:0; background:var(--bg-panel-2); z-index:2; font-size:11px; padding:9px 6px; white-space:nowrap; font-weight:600; color:var(--text-dim);}
  table.crono th.lab, table.crono td.lab{position:sticky; left:0; z-index:1; background:var(--bg-panel); min-width:176px; max-width:176px; padding:8px 10px; text-align:left; font-weight:500; font-size:13px; white-space:normal; color:var(--text);}
  table.crono thead th.lab{z-index:3; background:var(--bg-panel-2);}
  table.crono td.sum, table.crono td.meta{min-width:56px; text-align:center; font-variant-numeric:tabular-nums; background:var(--bg-panel); padding:0 6px; font-weight:600;}
  table.crono td.sum.bad{color:#f0b9b1; background:rgba(192,101,90,.18);}
  table.crono td.meta{color:var(--accent-light);}
  table.crono th.yr, table.crono td.yr{border-left:2px solid var(--line-strong);}
  table.crono th.cur{color:var(--accent-light); background:#4b6455;}
  table.crono td.cur{background:rgba(201,152,122,0.07);}
  .cin{width:54px; background:transparent; border:0; color:var(--text); text-align:center; font:inherit; font-variant-numeric:tabular-nums; padding:10px 2px;}
  .cin:focus{outline:2px solid var(--accent); outline-offset:-2px; background:rgba(201,152,122,0.15);}
  .cin.has{background:rgba(201,152,122,0.24); font-weight:600;}
  .cin::placeholder{color:transparent;}

  /* ---------- DADOS ---------- */
  .grid-manual{display:grid; grid-template-columns:150px repeat(6,minmax(54px,1fr)); gap:8px; align-items:center; font-size:13px; overflow-x:auto; min-width:0;}
  .grid-manual .hd{font-size:11.5px; color:var(--text-dim); text-align:center;}
  .grid-manual input{width:100%;}
  details{margin-top:6px;}
  summary{cursor:pointer; font-size:13.5px; color:var(--accent-light);}
  details p, details li{font-size:13px; color:var(--text-dim); line-height:1.6;}
  .row-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  #toast{position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); background:#1c2925; border:1px solid var(--line-strong); color:var(--text); padding:10px 18px; border-radius:20px; font-size:13px; opacity:0; pointer-events:none; transition:.2s; z-index:100; max-width:90vw; text-align:center;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:760px){
    header.site{padding:10px 14px;}
    .brand img{height:36px;}
    main{padding:20px 14px 70px;}
    .page-head h1{font-size:25px;}
    .nums .big{font-size:28px;}
    table.painel th.rowh{width:116px; font-size:12px;}
    .grid-manual{grid-template-columns:110px repeat(6,60px);}
  }
</style>
</head>

// ---------- estado ----------
function planoPadrao(){
  const p = clone(D.plano);
  D.geral.forEach(g => p[g.id] = g.plano.slice());
  return p;
}
let S = { plan: planoPadrao(), casas: {}, manual: {}, tol: 2, refMes: null, importadoEm: null, fonte: null };
let lastRaw = null;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p.plan) for(const k in p.plan){
      if(S.plan[k] && Array.isArray(p.plan[k]) && p.plan[k].length === NMES) S.plan[k] = p.plan[k].map(n => +n || 0);
    }
    if(p.casas && typeof p.casas === 'object') S.casas = p.casas;
    if(p.manual && typeof p.manual === 'object') S.manual = p.manual;
    if(typeof p.tol === 'number') S.tol = p.tol;
    S.refMes = (typeof p.refMes === 'number') ? p.refMes : null;
    S.importadoEm = p.importadoEm || null;
    S.fonte = p.fonte || null;
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Não consegui salvar neste navegador.'); }
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800);
}

// ---------- importação do acompanhamento ----------
function normVal(raw){
  const n = Number(raw);
  if(!isFinite(n)) return 0;
  return n >= 75 ? 100 : n >= 25 ? 50 : 0;
}
function parseConferencia(obj){
  if(!obj || typeof obj !== 'object') throw new Error('Formato não reconhecido.');
  const casas = {}; let n = 0;
  for(const h in obj){
    const num = parseInt(String(h).replace(/^h/, ''), 10);
    if(!(num >= 1 && num <= 54)) continue;
    const items = obj[h] && obj[h].items;
    if(!items || typeof items !== 'object') continue;
    const o = {}; for(const id in items) o[id] = normVal(items[id]);
    casas[num] = o; n++;
  }
  if(!n) throw new Error('Não encontrei nenhuma casa (1 a 54) com itens nesse texto.');
  return { casas, n };
}
function aplicarImport(casas, fonte){
  S.casas = casas; S.importadoEm = new Date().toISOString(); S.fonte = fonte; save();
}

// sites estiverem no mesmo endereço (usuario.github.io) e o de conferência já tiver sido aberto aqui.
function puxarDaConferencia(){
  let raw = null;
  try{ raw = localStorage.getItem(OLD_KEY); }catch(e){}
  if(!raw) return { ok:false, motivo:'nao-encontrado' };
  if(raw === lastRaw) return { ok:true, igual:true };
  try{
    const { casas, n } = parseConferencia(JSON.parse(raw));
    lastRaw = raw; aplicarImport(casas, 'conferencia');
    return { ok:true, n };
  }catch(e){ return { ok:false, motivo:'invalido', erro:e.message }; }
}

// ---------- cálculos ----------
function mesAtualIdx(){
  const d = new Date();
  return (d.getFullYear() * 12 + d.getMonth()) - D.meses[0].ym;
}
function refIdx(){
  return S.refMes !== null ? S.refMes : Math.max(-1, Math.min(NMES - 1, mesAtualIdx()));
}
function mesLabel(i){ return i < 0 ? 'antes de ' + D.meses[0].label : D.meses[Math.min(i, NMES - 1)].label; }
function metaOf(key, idx){
  const a = S.plan[key]; let s = 0;
  for(let i = 0; i <= idx && i < NMES; i++) s += a[i] || 0;
  s = Math.min(1, s);
  return s > 0.9995 ? 100 : s * 100;
}
function hasData(){ return Object.keys(S.casas).length > 0; }
function itemPct(b, id){
  const cs = BLOCO[b].casas; let t = 0;
  cs.forEach(c => { const v = S.casas[c] ? S.casas[c][id] : 0; t += (v || 0); });
  return t / cs.length;
}
function classify(exec, meta){
  if(exec === null) return 'semdado';
  if(meta < 0.05) return exec > 0.5 ? 'adiantado' : 'naoprev';
  if(meta >= 99.9) return exec >= 99.9 ? 'ok' : 'atrasado';
  if(exec < meta - S.tol) return 'atrasado';
  if(exec > meta + S.tol) return 'adiantado';
  return 'ok';
}
function evaluate(b, s, idx){
  const key = b + ':' + s.id;
  const meta = metaOf(key, idx);
  let exec = null;
  if(s.itens.length){
    if(hasData()){ let t = 0; s.itens.forEach(id => t += itemPct(b, id)); exec = t / s.itens.length; }
  }else{
    const m = S.manual[key]; if(typeof m === 'number') exec = m;
  }
  return { meta, exec, st: classify(exec, meta) };
}
// Itens são executados em ordem: com meta de X% dos N itens, os primeiros ceil(X*N) já deveriam estar 100%.
function itemEval(b, s, meta){
  const N = s.itens.length;
  const k = meta < 0.05 ? 0 : Math.min(N, Math.ceil(meta / 100 * N - 1e-9));
  const lista = s.itens.map((id, i) => {
    const pct = itemPct(b, id);
    let st;
    if(i < k) st = pct >= 99.9 ? 'ok' : 'atrasado';
    else if(pct > 0.5) st = (i === k) ? 'andamento' : 'adiantado';
    else st = 'futuro';
    return { id, i, pct, st, name: D.itens[id] };
  });
  return { k, N, lista };
}
function fmtPct(n){
  const r = Math.round(n * 10) / 10;
  return (r % 1 === 0 ? r.toFixed(0) : r.toFixed(1).replace('.', ',')) + '%';
}
const ST_NOME = { ok:'No prazo', ahead:'Adiantado', adiantado:'Adiantado', atrasado:'Atrasado', naoprev:'Ainda não previsto', semdado:'Sem dado' };
const ST_CLS = { ok:'st-ok', adiantado:'st-ahead', atrasado:'st-late', naoprev:'st-naoprev', semdado:'st-semdado' };

function parseNum(txt){
  const t = String(txt).trim().replace('%', '').replace(',', '.');
  if(t === '') return null;
  const n = parseFloat(t);
  return isFinite(n) ? n : null;
}
const fmtIn = frac => frac ? String(Math.round(frac * 10000) / 100).replace('.', ',') : '';

function viewCrono(tab){
  const ehGeral = tab === 'g';
  const bid = ehGeral ? null : parseInt(tab, 10);
  if(!ehGeral && !BLOCO[bid]) return viewCrono('1');
  const idx = refIdx();
  const linhas = ehGeral
    ? D.geral.map(g => ({ key: g.id, label: g.label }))
    : D.setores.map(s => ({ key: bid + ':' + s.id, label: s.label }));

  const tabs = D.blocos.map(b => `<a href="#/cronograma/${b.id}" class="${!ehGeral && b.id === bid ? 'active' : ''}">Bloco ${b.id}</a>`).join('')
    + `<a href="#/cronograma/g" class="${ehGeral ? 'active' : ''}">Geral</a>`;

  const yrFirst = i => i === 0 || D.meses[i].label.slice(-2) !== D.meses[i - 1].label.slice(-2);
  const head = `<tr><th class="lab">${ehGeral ? 'Item geral' : 'Setor'}</th><th>Σ</th><th>Meta</th>${D.meses.map((m, i) => `<th class="${i === idx ? 'cur' : ''} ${yrFirst(i) ? 'yr' : ''}">${esc(m.label)}</th>`).join('')}</tr>`;
  const body = linhas.map(r => {
    const arr = S.plan[r.key];
    const tot = arr.reduce((a, v) => a + (v || 0), 0) * 100;
    const bad = Math.abs(tot - 100) > 0.5;
    const cels = arr.map((v, i) => `<td class="${i === idx ? 'cur' : ''} ${yrFirst(i) ? 'yr' : ''}"><input class="cin ${v ? 'has' : ''}" data-key="${r.key}" data-i="${i}" inputmode="decimal" value="${fmtIn(v)}" aria-label="${esc(r.label)} ${esc(D.meses[i].label)}"></td>`).join('');
    return `<tr><td class="lab">${esc(r.label)}</td><td class="sum ${bad ? 'bad' : ''}" data-sum="${r.key}" title="Soma da linha — deve dar 100%">${fmtPct(tot)}</td><td class="meta" data-meta="${r.key}">${fmtPct(metaOf(r.key, idx))}</td>${cels}</tr>`;
  }).join('');

  app.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Cronograma geral</h1>
        <p>Cada célula é a parte (%) do setor que deve ser concluída naquele mês — a soma de cada linha deve dar 100%. Toque numa célula para editar; as mudanças já entram no Painel. A coluna <b>Meta</b> é o acumulado até ${esc(mesLabel(idx))}.</p>
      </div>
    </div>
    <div class="tabs">${tabs}</div>
    ${ehGeral ? '<p class="hint" style="margin:0 0 12px">Itens gerais do condomínio (rua, áreas comuns, muros…). Ficam só aqui — o Painel compara apenas os setores por bloco.</p>' : ''}
    <div class="crono-wrap"><table class="crono"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="row-actions" style="margin-top:16px">
      <button class="btn danger" id="restore">Restaurar cronograma original (REV18)</button>
      <span class="hint" style="margin:0">As edições ficam salvas só neste navegador.</span>
    </div>
  `;

  const wrap = $('.crono-wrap');
  const thCur = wrap.querySelector('th.cur');
  if(thCur) wrap.scrollLeft = Math.max(0, thCur.offsetLeft - 330);
  wrap.addEventListener('focusin', e => { if(e.target.classList.contains('cin')) e.target.select(); });
  wrap.addEventListener('change', e => {
    const inp = e.target; if(!inp.classList.contains('cin')) return;
    const key = inp.dataset.key, i = +inp.dataset.i;
    let v = parseNum(inp.value); v = v === null ? 0 : Math.max(0, Math.min(100, v));
    S.plan[key][i] = Math.round(v * 100) / 10000;
    inp.value = fmtIn(S.plan[key][i]);
    inp.classList.toggle('has', S.plan[key][i] > 0);
    const tot = S.plan[key].reduce((a, x) => a + (x || 0), 0) * 100;
    const sumEl = wrap.querySelector(`[data-sum="${key}"]`);
    sumEl.textContent = fmtPct(tot); sumEl.classList.toggle('bad', Math.abs(tot - 100) > 0.5);
    wrap.querySelector(`[data-meta="${key}"]`).textContent = fmtPct(metaOf(key, refIdx()));
    save();
  });
  const rb = $('#restore');
  rb.addEventListener('click', () => {
    if(rb.dataset.armed){
      const orig = planoPadrao();
      linhas.forEach(r => S.plan[r.key] = orig[r.key].slice());
      save(); toast('Cronograma desta aba restaurado.'); render();
    }else{
      rb.dataset.armed = '1'; rb.textContent = 'Toque de novo para confirmar (só esta aba)';
      setTimeout(() => { if(rb.isConnected){ delete rb.dataset.armed; rb.textContent = 'Restaurar cronograma original (REV18)'; } }, 4000);
    }
  });
}

    try{
      const { casas, n } = parseConferencia(JSON.parse($('#paste').value.trim().replace(/^["']|["']$/g, '')));
      aplicarImport(casas, 'colado'); toast(`Importado: ${n} casas.`); render();
    }catch(e){ msg.textContent = (e instanceof SyntaxError) ? 'O texto colado não parece ser o que o comando copiou. Tente copiar de novo.' : 'Não consegui ler: ' + (e.message || e); }
  });
  app.querySelectorAll('.man').forEach(inp => inp.addEventListener('change', () => {
    const v = parseNum(inp.value);
    if(v === null) delete S.manual[inp.dataset.key]; else S.manual[inp.dataset.key] = Math.max(0, Math.min(100, v));
    save(); toast('Salvo.');
  }));
  $('#tol').addEventListener('change', e => {
    const v = parseNum(e.target.value); S.tol = v === null ? 2 : Math.max(0, Math.min(50, v)); save(); toast('Salvo.');
  });
  const cb = $('#clearBtn');
  cb.addEventListener('click', () => {
    if(cb.dataset.armed){ S.casas = {}; S.importadoEm = null; S.fonte = null; lastRaw = null; save(); toast('Dados apagados.'); render(); }
    else{
      cb.dataset.armed = '1'; cb.textContent = 'Toque de novo para confirmar';
      setTimeout(() => { if(cb.isConnected){ delete cb.dataset.armed; cb.textContent = 'Apagar dados do acompanhamento deste navegador'; } }, 4000);
    }
  });
}

// ---------- roteamento ----------
function render(){
  const p = location.hash.replace(/^#\/?/, '').split('/');
  let r = 'painel';
  if(p[0] === 'detalhe'){ r = 'painel'; viewDetalhe(parseInt(p[1], 10), p[2]); }
  else if(p[0] === 'cronograma'){ r = 'cronograma'; viewCrono(p[1] || '1'); }
  else if(p[0] === 'dados'){ r = 'dados'; viewDados(); }
  else viewPainel();
  document.querySelectorAll('nav.site a[data-r]').forEach(a => a.classList.toggle('active', a.dataset.r === r));
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

$('#refreshBtn').addEventListener('click', () => {
  const r = puxarDaConferencia();
  if(r.ok) toast(r.igual ? 'Já estava atualizado.' : `Dados atualizados: ${r.n} casas.`);
  else toast(r.motivo === 'nao-encontrado' ? 'Não achei dados do site de conferência neste navegador — veja a aba Dados.' : 'Não consegui ler os dados.');
  render();
});
function repuxarSilencioso(){
  const r = puxarDaConferencia();
  if(r.ok && !r.igual && !document.querySelector('.crono-wrap')) render();
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) repuxarSilencioso(); });
window.addEventListener('storage', e => { if(e.key === OLD_KEY) repuxarSilencioso(); });

// ---------- início ----------
load();
puxarDaConferencia();
render();
})();
</script>
</body>
</html>
